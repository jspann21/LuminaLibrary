[package]
name = "lumina_library"
version = "0.1.3"
description = "Lumina Library desktop application"
authors = ["Lumina Library"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.95.0"

[lib]
name = "lumina_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring-core = "1.0"
log = "0.4"
lopdf = "0.42"
notify = "8.2"
once_cell = "1.20"
parking_lot = "0.12"
r2d2 = "0.8"
r2d2_sqlite = "0.34"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
roxmltree = "0.21"
rusqlite = { version = "0.39", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
strsim = "0.11"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
url = "2.5"
uuid = { version = "1.23", features = ["v4", "serde"] }
walkdir = "2.5"
zip = "8.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }
